
Download_Mirror='https://soft.lnmp.com'

Nginx_Modules_Options=''
PHP_Modules_Options=''

# Empty selects a memory-aware value; an explicit override must be positive.
LNMP_BUILD_JOBS="${LNMP_BUILD_JOBS:-}"

##MySQL/MariaDB database directory##
MySQL_Data_Dir='/usr/local/mysql/var'
MariaDB_Data_Dir='/usr/local/mariadb/var'
##Default website home directory##
Default_Website_Dir='/home/wwwroot/default'

Enable_Nginx_Openssl='y'
Enable_Nginx_Lua='n'
Enable_Ngx_FancyIndex='n'
Enable_Swap='y'
Enable_PHP_Exif='n'
Enable_PHP_Fileinfo='n'
Enable_PHP_Ldap='n'
Enable_PHP_Bz2='n'
Enable_PHP_Sodium='n'
Enable_PHP_Imap='n'
Enable_Public_Diagnostics='n'
# Installation statistics default to on; n disables and ask prompts for consent.
LNMP_Install_Stats="${LNMP_Install_Stats:-y}"
# Keep administrator firewall rules; open HTTP/HTTPS explicitly when needed.
Enable_Firewall_Management='n'

Download_Insecure='n'
Enable_Download_Checksum='y'
